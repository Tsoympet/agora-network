[workspace]
members = [
    "core/crates/types",
    "core/crates/crypto",
    "core/crates/kheavyhash",
    "core/crates/consensus",
    "core/crates/state-machine",
    "core/crates/p2p",
    "core/crates/rpc",
    "core/crates/miner-sidecar",
    "core/crates/governance",
    "core/crates/ovolos-rollup",
    "core/crates/bridge-sdk",
    "core/crates/intent-engine",
    "core/node-bin",
    "infrastructure/dns-seeder",
    "infrastructure/stratum-pool",
    "infrastructure/testnet-faucet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tsoympet/agora-network"

[workspace.dependencies]
agora-types = { path = "core/crates/types" }
agora-crypto = { path = "core/crates/crypto" }
agora-kheavyhash = { path = "core/crates/kheavyhash" }
agora-consensus = { path = "core/crates/consensus" }
agora-state-machine = { path = "core/crates/state-machine" }
agora-p2p = { path = "core/crates/p2p" }
agora-rpc = { path = "core/crates/rpc" }
agora-governance = { path = "core/crates/governance" }
agora-ovolos-rollup = { path = "core/crates/ovolos-rollup" }
agora-bridge-sdk = { path = "core/crates/bridge-sdk" }
agora-intent-engine = { path = "core/crates/intent-engine" }

borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
ts-rs = { version = "10.1", features = ["serde-compat"] }

# Audited cryptography only — never replace with custom implementations.
secp256k1 = { version = "0.30", features = ["global-context", "rand", "std"] }
bip39 = { version = "2.1", features = ["rand"] }
# BIP-32 CKD used to realize BIP-44 paths; secret bytes are then loaded into secp256k1.
bip32 = "0.5"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "macros",
    "identify",
    "dns",
    "request-response",
    "cbor",
] }
serde_json = "1.0"
revm = { version = "42", default-features = false, features = ["std", "secp256k1", "portable"] }
# Official RandomX via rust-randomx (cmake + libstdc++; see .cargo/config.toml).
rust-randomx = "0.7.6"
