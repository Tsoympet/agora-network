name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: Fast crates (no RandomX / RocksDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Test portable crates
        run: >
          cargo test --workspace
          --exclude agora-node
          --exclude agora-miner-sidecar
          --exclude agora-consensus
          --exclude agora-p2p
          --exclude agora-stratum-pool
          --exclude agora-dns-seeder
          --exclude agora-testnet-faucet

      - name: Consensus / P2P without RandomX
        run: |
          cargo test -p agora-consensus --no-default-features
          cargo test -p agora-p2p

      - name: Wallet vault crypto smoke
        run: |
          (cd apps/shared && npm ci --ignore-scripts)
          node scripts/test_vault.mjs

      - name: Clippy (consensus core — blocking)
        run: >
          cargo clippy
          -p agora-types
          -p agora-crypto
          -p agora-consensus
          -p agora-state-machine
          -p agora-rpc
          -p agora-governance
          --all-targets --no-default-features
          -- -D warnings

      - name: Clippy (rest of workspace — advisory)
        run: >
          cargo clippy --workspace
          --exclude agora-node
          --exclude agora-miner-sidecar
          --exclude agora-consensus
          --exclude agora-stratum-pool
          --exclude agora-dns-seeder
          --exclude agora-testnet-faucet
          -- -D warnings
        continue-on-error: true

  deny:
    name: Dependency audit + licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  apps:
    name: Build web/desktop apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shared light-client deps
        working-directory: apps/shared
        run: npm ci

      - name: Explorer build
        working-directory: apps/explorer
        run: |
          npm ci
          npm run build

      - name: Desktop frontend build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  node:
    name: Node + RandomX (slow)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test agora-node HTTP auth + multi-block IBD + RandomX
        run: |
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1)")"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          cargo test -p agora-node --bin agora-node http::
          cargo test -p agora-node --bin agora-node multiblock_headers_first_catchup
          cargo test -p agora-consensus --features randomx --lib
