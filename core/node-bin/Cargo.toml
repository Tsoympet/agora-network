[package]
name = "agora-node"
description = "Agora Network full node entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agora-node"
path = "src/main.rs"

[features]
default = ["rocksdb", "randomx"]
# Durable column-family storage (requires C++ toolchain / libstdc++).
rocksdb = ["agora-state-machine/rocksdb"]
# Official RandomX verify/mine path (cmake + libstdc++).
randomx = ["agora-consensus/randomx"]

[dependencies]
agora-types = { workspace = true }
agora-crypto = { workspace = true }
agora-consensus = { workspace = true }
agora-state-machine = { workspace = true }
agora-p2p = { workspace = true }
agora-rpc = { workspace = true }
borsh = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
