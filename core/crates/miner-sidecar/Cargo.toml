[package]
name = "agora-miner-sidecar"
description = "Standalone RandomX CPU miner sidecar for Agora Network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agora-miner"
path = "src/main.rs"

[dependencies]
agora-types = { workspace = true }
agora-crypto = { workspace = true }
agora-consensus = { workspace = true, features = ["randomx"] }
agora-rpc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
