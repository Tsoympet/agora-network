[package]
name = "agora-ovolos-rollup"
description = "Ovolos optimistic rollup (L2) for EVM smart-contract scaling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["revm"]
# Bind the audited revm EVM behind EvmExecutor (+ signed Eth txs).
revm = ["dep:revm", "dep:k256", "dep:alloy-rlp", "dep:alloy-primitives"]

[dependencies]
agora-types = { workspace = true }
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
revm = { workspace = true, optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
alloy-rlp = { version = "0.3", optional = true }
alloy-primitives = { version = "1.6", default-features = false, features = ["std", "rlp"], optional = true }
