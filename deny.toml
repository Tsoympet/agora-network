# cargo-deny configuration — dependency security & license policy gate.
# Run locally with: cargo deny check

[advisories]
version = 2
# Fail on known security vulnerabilities in the dependency tree (RUSTSEC).
yanked = "warn"
# Only fail unmaintained advisories for direct workspace crates. Transitive
# `paste` (alloy/revm + netlink) has no maintained drop-in until upstreams migrate.
unmaintained = "workspace"
# `ignore` may list specific RUSTSEC ids with a justification if a fix is unavailable.
ignore = [
    # Transitive via libp2p-dns → hickory-resolver 0.25. We do not enable DNSSEC
    # validation on the libp2p DNS transport; no safe upgrade until libp2p bumps hickory.
    { id = "RUSTSEC-2026-0118", reason = "transitive via libp2p-dns; DNSSEC validation unused" },
    { id = "RUSTSEC-2026-0119", reason = "transitive via libp2p-dns; awaiting libp2p hickory 0.26+" },
]

[licenses]
version = 2
# SPDX license allowlist for all dependencies. Anything outside this list fails CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Per-crate license clarifications can be added here if a crate lacks SPDX metadata.
exceptions = []

[bans]
# Warn on multiple versions of the same crate; deny wildcard version requirements.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps are fine once crates set `publish = false`.
allow-wildcard-paths = true

[sources]
# Only crates.io and in-repo path/git deps are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
