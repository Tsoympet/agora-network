[package]
name = "agora-desktop"
version = "0.1.0"
description = "Agora Network desktop wallet"
authors = ["Agora Network"]
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone crate — keep out of the monorepo workspace so Tauri deps stay isolated.
[workspace]

[lib]
name = "agora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
