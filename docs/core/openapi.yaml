openapi: 3.0.3
info:
  title: Agora Node JSON-RPC
  version: 0.1.0
  description: |
    HTTP JSON-RPC 2.0-style surface (`POST /rpc`). When `AGORA_RPC_TOKEN` is set,
    wallet/mining methods require `Authorization: Bearer <token>`.

    Programmable execution is OVL-only and is exposed only through
    `agora_submitOvlExecution`. DRC has no VM, bytecode, deploy/call, Hook, or
    generic execution API. DRC submission methods below accept closed,
    protocol-native typed state-machine operations; they are not contracts.
  x-agora-programmable-execution-asset: OVL
  x-agora-drc-programmable-execution: false
servers:
  - url: http://127.0.0.1:8545
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /rpc:
    post:
      summary: Canonical Trident JSON-RPC
      description: |
        The method enum is closed. In particular, no generic execution method
        or DRC contract/VM method exists, and `agora_submitOvlExecution` has no
        asset selector.
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Bearer token when AGORA_RPC_TOKEN is configured
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                id:
                  nullable: true
                method:
                  type: string
                  enum:
                    - agora_getDagTips
                    - agora_getBlock
                    - agora_getTransaction
                    - agora_getMempool
                    - agora_getNodeInfo
                    - agora_estimateFee
                    - agora_submitTransaction
                    - agora_submitAccountTransfer
                    - agora_submitOvlExecution
                    - agora_submitDrcPayment
                    - agora_getDrcPayment
                    - agora_getDrcPaymentByInvoice
                    - agora_submitDrcAccountPolicy
                    - agora_getDrcAccountPolicy
                    - agora_submitDrcDepositPreauth
                    - agora_getDrcDepositPreauth
                    - agora_submitDrcRegularKey
                    - agora_getDrcAccountKeys
                    - agora_submitDrcSignerList
                    - agora_getDrcAccountSignerList
                    - agora_submitDrcTicketCreate
                    - agora_getDrcTicket
                    - agora_submitDrcEscrowCreate
                    - agora_submitDrcEscrowFinish
                    - agora_submitDrcEscrowCancel
                    - agora_getDrcEscrow
                    - agora_getDrcEscrowReceipt
                    - agora_submitDrcCheckCreate
                    - agora_submitDrcCheckCash
                    - agora_submitDrcCheckCancel
                    - agora_getDrcCheck
                    - agora_getDrcCheckReceipt
                    - agora_submitDrcPaymentChannelCreate
                    - agora_submitDrcPaymentChannelFund
                    - agora_submitDrcPaymentChannelClaim
                    - agora_submitDrcPaymentChannelClose
                    - agora_getDrcPaymentChannel
                    - agora_getDrcPaymentChannelReceipt
                    - agora_getDrcPaymentChannelFundEvent
                    - agora_getDrcPaymentChannelClaimEvent
                    - agora_getDrcPaymentChannelScheduleEvent
                    - agora_verifyDrcPaymentChannelClaim
                    - agora_submitDrcTrustLineSet
                    - agora_submitDrcIssuedTransfer
                    - agora_getDrcTrustLine
                    - agora_getDrcIssuerLiability
                    - agora_getDrcIssuedTransferReceipt
                    - agora_submitDrcIssuedAssetPolicySet
                    - agora_submitDrcTrustLineIssuerControl
                    - agora_submitDrcIssuedClawback
                    - agora_getDrcIssuedAssetPolicy
                    - agora_getDrcIssuedAssetPolicyReceipt
                    - agora_getDrcTrustLineIssuerControlReceipt
                    - agora_getDrcIssuedClawbackReceipt
                    - agora_getDrcObject
                    - agora_getDrcAccountObjects
                    - agora_getDrcOperation
                    - agora_getDrcTransaction
                    - agora_getBalance
                    - agora_getUtxos
                    - agora_fundAddress
                    - agora_getBlockTemplate
                    - agora_submitBlock
                    - agora_getFinality
                    - agora_getFinalizedTip
                    - agora_submitAttestation
                    - agora_getValidatorSet
                    - agora_getValidator
                    - agora_getRewardPool
                    - agora_getNativeAssetSupply
                    - agora_getProtocolTreasuries
                    - agora_getCommunityRegistry
                    - agora_submitStakeTx
                    - agora_getConstitution
                    - agora_getGovernance
                    - agora_listProposals
                    - agora_getProposal
                    - agora_listOffices
                    - agora_listForumTopics
                    - agora_submitProposal
                    - agora_depositProposal
                    - agora_openProposalVoting
                    - agora_castGovVote
                    - agora_tallyProposal
                    - agora_enterProposalTimelock
                    - agora_executeProposal
                    - agora_postForumTopic
                    - agora_ackConstitution
                    - agora_sponsorProposal
                    - agora_assentProposal
                params:
                  nullable: true
      responses:
        "200":
          description: JSON-RPC result or error
        "401":
          description: Missing/invalid bearer token
components:
  schemas:
    FeeEstimate:
      type: object
      properties:
        min_relay_fee:
          type: integer
        suggested_fee:
          type: integer
    NodeInfo:
      type: object
      properties:
        network: { type: string }
        version: { type: string }
        bits: { type: integer }
        min_relay_fee: { type: integer }
        pow_algorithm: { type: string }
        genesis_hash: { type: string, nullable: true }
    NativeAssetSupply:
      type: object
      required: [asset, maximum_supply, issued_supply, burned_supply, net_supply]
      properties:
        asset:
          type: string
          enum: [TLT, OVL, DRC]
        maximum_supply:
          type: string
          pattern: "^[0-9]+$"
        issued_supply:
          type: string
          pattern: "^[0-9]+$"
        burned_supply:
          type: string
          pattern: "^[0-9]+$"
        net_supply:
          type: string
          pattern: "^[0-9]+$"
    DrcLedgerObjectKind:
      type: string
      enum:
        - account_policy
        - deposit_preauthorization
        - regular_key
        - signer_list
        - ticket_set
        - escrow
        - check
        - payment_channel
        - trust_line
        - issued_asset_policy
    DrcAccountObjectsParams:
      type: object
      required: [account]
      additionalProperties: false
      properties:
        account:
          type: string
          description: Agora bech32m or 20-byte hex address
        kind:
          $ref: "#/components/schemas/DrcLedgerObjectKind"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        cursor:
          type: string
          description: Opaque versioned cursor bound to account and kind
    DrcLedgerObjectDescriptor:
      type: object
      required: [version, object_id, kind, owner, key, object]
      additionalProperties: false
      properties:
        version: { type: integer }
        object_id:
          type: array
          minItems: 32
          maxItems: 32
          items: { type: integer, minimum: 0, maximum: 255 }
        kind:
          $ref: "#/components/schemas/DrcLedgerObjectKind"
        owner:
          type: array
          minItems: 20
          maxItems: 20
          items: { type: integer, minimum: 0, maximum: 255 }
        key:
          type: object
          description: Closed generated DrcLedgerObjectKey union
        object:
          type: object
          description: Closed generated DrcLedgerObject union; never generic execution data
    DrcAcceptedOperationReceipt:
      type: object
      required:
        - version
        - operation_id
        - historical_transaction_id
        - owner
        - kind
        - canonical_block_id
        - operation
        - affected_object_ids
      additionalProperties: false
      properties:
        version: { type: integer }
        operation_id:
          type: array
          minItems: 32
          maxItems: 32
          items: { type: integer, minimum: 0, maximum: 255 }
        historical_transaction_id:
          type: array
          minItems: 32
          maxItems: 32
          items: { type: integer, minimum: 0, maximum: 255 }
        owner:
          type: array
          minItems: 20
          maxItems: 20
          items: { type: integer, minimum: 0, maximum: 255 }
        kind: { type: string }
        canonical_block_id:
          type: array
          minItems: 32
          maxItems: 32
          items: { type: integer, minimum: 0, maximum: 255 }
        application_blue_score:
          type: integer
          nullable: true
        operation:
          type: object
          description: Closed generated DrcOperation union
        affected_object_ids:
          type: array
          items:
            type: array
            minItems: 32
            maxItems: 32
            items: { type: integer, minimum: 0, maximum: 255 }
